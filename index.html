<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cohen-Sutherland</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 16px;
    }

    h1 { color: #7ecfff; font-size: 1rem; letter-spacing: .15em; text-transform: uppercase; }

    #main { display: flex; gap: 24px; align-items: flex-start; }

    canvas { background: #000; border: 1px solid #2a4a6a; display: block; }

    #panel { width: 230px; display: flex; flex-direction: column; gap: 10px; }

    .box {
      border: 1px solid #2a4a6a;
      padding: 10px;
      border-radius: 3px;
      font-size: .76rem;
      line-height: 1.8;
    }

    .box h3 { color: #7ecfff; margin-bottom: 6px; font-size: .79rem; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    label { color: #aaa; font-size: .73rem; }

    input[type=number] {
      background: #111;
      border: 1px solid #2a4a6a;
      color: #7ecfff;
      padding: 3px 6px;
      font-family: 'Courier New', monospace;
      font-size: .73rem;
      width: 100%;
      border-radius: 2px;
    }

    button {
      background: transparent;
      border: 1px solid #2a6a9a;
      color: #7ecfff;
      padding: 5px 12px;
      font-family: 'Courier New', monospace;
      font-size: .76rem;
      cursor: pointer;
      border-radius: 2px;
      transition: background .2s;
    }
    button:hover { background: #0a2a3a; }

    #nav { display: flex; gap: 5px; justify-content: center; }

    /* Leyenda de colores */
    .leyenda { display: flex; flex-direction: column; gap: 4px; }
    .ley-item { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: #aaa; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Códigos de región en el panel */
    .codigo-row { display: flex; justify-content: space-between; }
    .code-tag {
      background: #0a1a2a;
      border: 1px solid #2a4a6a;
      border-radius: 2px;
      padding: 1px 5px;
      font-size: .7rem;
      color: #f0c040;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>

<h1>Algoritmo de Cohen-Sutherland — Recorte de Líneas</h1>

<div id="main">
  <canvas id="canvas" width="500" height="500"></canvas>

  <div id="panel">

    <!-- ── Ventana de recorte ── -->
    <div class="box">
      <h3>Ventana de recorte</h3>
      <div class="grid2">
        <label>x<sub>min</sub></label><label>y<sub>min</sub></label>
        <input id="xmin" type="number" value="100">
        <input id="ymin" type="number" value="100">
        <label>x<sub>max</sub></label><label>y<sub>max</sub></label>
        <input id="xmax" type="number" value="380">
        <input id="ymax" type="number" value="380">
      </div>
      <br>
      <button onclick="actualizar()">Actualizar</button>
    </div>

    <!-- ── Navegación ── -->
    <div class="box">
      <h3>Escena</h3>
      <div id="nav">
        <button onclick="irA(0)">|&lt;</button>
        <button onclick="anterior()">&lt;</button>
        <button onclick="siguiente()">&gt;</button>
        <button onclick="irA(lineas.length-1)">&gt;|</button>
      </div>
      <br>
      <div id="escena-label" style="text-align:center;color:#aaa;font-size:.74rem;">Escena 1 / 5</div>
    </div>

    <!-- ── Info línea y recorte ── -->
    <div class="box" id="coords">cargando...</div>

    <!-- ── Leyenda ── -->
    <div class="box">
      <h3>Leyenda</h3>
      <div class="leyenda">
        <div class="ley-item"><div class="dot" style="background:#4ab8e8"></div> Ventana de recorte</div>
        <div class="ley-item"><div class="dot" style="background:#444"></div> Línea original</div>
        <div class="ley-item"><div class="dot" style="background:#00e676"></div> Segmento aceptado</div>
        <div class="ley-item"><div class="dot" style="background:#ff5252"></div> Segmento rechazado</div>
      </div>
    </div>

  </div>
</div>

<script>

    const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  let escenaActual = 0; // índice de la escena que se muestra

  const lineas = [
    {
      label: "Caso 1 — Aceptación trivial", // etiqueta para mostrar en la interfaz
      desc:  "Ambos puntos dentro → se dibuja completa.",
      p1: { x: 150, y: 160 },
      p2: { x: 320, y: 290 }
    },
    {
      label: "Caso 2 — Rechazo trivial",
      desc:  "Ambos puntos fuera del mismo lado → se descarta.",
      p1: { x: 20,  y: 20  },
      p2: { x: 90,  y: 70  }
    },
    {
      label: "Caso 3 — Recorte por un lado",
      desc:  "Un punto dentro, otro fuera por la derecha.",
      p1: { x: 200, y: 210 },
      p2: { x: 460, y: 250 }
    },
    {
      label: "Caso 4 — Recorte por dos lados",
      desc:  "La línea cruza dos bordes de la ventana.",
      p1: { x: 40,  y: 60  },
      p2: { x: 460, y: 430 }
    },
    {
      label: "Caso 5 — Línea vertical",
      desc:  "Línea casi vertical que cruza borde sup. e inf.",
      p1: { x: 240, y: 20  },
      p2: { x: 255, y: 480 }
    }
  ];

  //Función base: pinta exactamente 1 píxel en (x, y). Todo el trazado gráfico pasa por aquí.
  function drawPixel(x, y, color = '#ffffff') {
    ctx.fillStyle = color;
    // fillRect(x, y, 1, 1) → exactamente 1 píxel
    ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
  }

   function assignCode(x, y, v) {
    let code = 0;                      // empezamos con 0000

    if (x < v.xmin) code |= 0b0001;   // LEFT   — fuera por la izquierda
    if (x > v.xmax) code |= 0b0010;   // RIGHT  — fuera por la derecha
    if (y > v.ymax) code |= 0b0100;   // BOTTOM — fuera por abajo (y↓)
    if (y < v.ymin) code |= 0b1000;   // TOP    — fuera por arriba

    return code; // retorna el código binario de 4 bits
  }

  function codeStr(code) {
    return code.toString(2).padStart(4, '0');
  }

  function cohenSutherland(x0, y0, x1, y1, v) {

    // Códigos de región iniciales de cada extremo
    let c0 = assignCode(x0, y0, v);
    let c1 = assignCode(x1, y1, v);

    // Guardamos los códigos originales para mostrar en el panel
    const c0orig = c0;
    const c1orig = c1;

    // Iteramos hasta aceptar o rechazar la línea
    while (true) {

      // ── Paso 2: Aceptación trivial ──
      // Si ambos códigos son 0000, la línea está completamente dentro
      if ((c0 | c1) === 0) {
        // Retornamos los puntos (posiblemente ya recortados)
        return { acepta: true, x0, y0, x1, y1, c0: c0orig, c1: c1orig };
      }

      // ── Paso 3: Rechazo trivial ──
      // Si el AND de ambos códigos != 0, ambos están del mismo lado
      if ((c0 & c1) !== 0) {
        return { acepta: false, x0, y0, x1, y1, c0: c0orig, c1: c1orig };
      }

      // ── Paso 4: Intersección ──
      // Elegimos el punto que está fuera (código != 0)
      // Usamos c0; si c0==0 usamos c1.
      let cOut = (c0 !== 0) ? c0 : c1;

      let xi, yi; // punto de intersección con el borde

      // Calculamos la pendiente para la fórmula de intersección
      // Evitamos división por cero con un pequeño delta
      let dx = x1 - x0;
      let dy = y1 - y0;

      // Determinamos con qué borde intersecta cOut
      // Orden: TOP → BOTTOM → RIGHT → LEFT

      if (cOut & 0b1000) {
        // Borde SUPERIOR (y < ymin): intersecta con y = ymin
        // x = x0 + dx * (ymin - y0) / dy
        yi = v.ymin;
        xi = x0 + dx * (v.ymin - y0) / dy;

      } else if (cOut & 0b0100) {
        // Borde INFERIOR (y > ymax): intersecta con y = ymax
        // x = x0 + dx * (ymax - y0) / dy
        yi = v.ymax;
        xi = x0 + dx * (v.ymax - y0) / dy;

      } else if (cOut & 0b0010) {
        // Borde DERECHO (x > xmax): intersecta con x = xmax
        // y = y0 + dy * (xmax - x0) / dx
        xi = v.xmax;
        yi = y0 + dy * (v.xmax - x0) / dx;

      } else {
        // Borde IZQUIERDO (x < xmin): intersecta con x = xmin
        // y = y0 + dy * (xmin - x0) / dx
        xi = v.xmin;
        yi = y0 + dy * (v.xmin - x0) / dx;
      }

      // Reemplazamos el punto externo por el punto de intersección
      if (cOut === c0) {
        // p0 estaba fuera → lo movemos a la intersección
        x0 = xi; y0 = yi;
        c0 = assignCode(x0, y0, v); // recalculamos su código
      } else {
        // p1 estaba fuera → lo movemos a la intersección
        x1 = xi; y1 = yi;
        c1 = assignCode(x1, y1, v); // recalculamos su código
      }
      // El while vuelve a evaluar con los nuevos puntos
    }
  }
  
  // traza el rectángulo de la ventana de recorte píxel a píxel.
  //  Internamente usa Bresenham para cada arista.
  //  Recibe la ventana y el contexto, no retorna nada visible
  //  pero pinta las 4 aristas del viewport en el canvas.

  function drawViewport(v, color = '#4ab8e8') {

    /**
     * Traza un segmento de (ax,ay) a (bx,by) pixel a pixel
     * usando Bresenham (interno a drawViewport).
     */
    function segmento(ax, ay, bx, by) {
      ax=Math.floor(ax); ay=Math.floor(ay);
      bx=Math.floor(bx); by=Math.floor(by);
      let dx=Math.abs(bx-ax), dy=Math.abs(by-ay);
      let sx=ax<bx?1:-1,      sy=ay<by?1:-1;
      let p=(dx>=dy)?(2*dy-dx):(2*dx-dy);
      let x=ax, y=ay;
      if (dx >= dy) {
        for (let i=0;i<=dx;i++) {
          drawPixel(x,y,color);
          if(p>=0){y+=sy;p+=2*dy-2*dx;}else{p+=2*dy;}
          x+=sx;
        }
      } else {
        for (let i=0;i<=dy;i++) {
          drawPixel(x,y,color);
          if(p>=0){x+=sx;p+=2*dx-2*dy;}else{p+=2*dx;}
          y+=sy;
        }
      }
    }

    // Las 4 aristas del rectángulo de recorte
    segmento(v.xmin, v.ymin, v.xmax, v.ymin); // arriba
    segmento(v.xmax, v.ymin, v.xmax, v.ymax); // derecha
    segmento(v.xmin, v.ymax, v.xmax, v.ymax); // abajo
    segmento(v.xmin, v.ymin, v.xmin, v.ymax); // izquierda
  }

  //Traza una línea arbitraria píxel a píxel con Bresenham
  //  (soporta todos los octantes).
  //  Es la única función usada para dibujar líneas.

    function drawLine(x0, y0, x1, y1, color = '#ffffff') {
    x0=Math.floor(x0); y0=Math.floor(y0);
    x1=Math.floor(x1); y1=Math.floor(y1);

    let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
    let sx=x0<x1?1:-1,      sy=y0<y1?1:-1;

    // p inicial: depende del eje conductor
    // Si |Δx| >= |Δy| → conducimos en X, p0 = 2·dy - dx
    // Si |Δy| >  |Δx| → conducimos en Y, p0 = 2·dx - dy
    let p=(dx>=dy)?(2*dy-dx):(2*dx-dy);
    let x=x0, y=y0;

    if (dx >= dy) {
      // Eje conductor X (pendiente suave)
      for (let i=0;i<=dx;i++) {
        drawPixel(x,y,color);
        // p >= 0 → mover también en Y (diagonal)
        // p < 0  → solo avanzar en X (horizontal)
        if(p>=0){y+=sy;p+=2*dy-2*dx;}else{p+=2*dy;}
        x+=sx;
      }
    } else {
      // Eje conductor Y (pendiente pronunciada)
      for (let i=0;i<=dy;i++) {
        drawPixel(x,y,color);
        if(p>=0){x+=sx;p+=2*dx-2*dy;}else{p+=2*dx;}
        y+=sy;
      }
    }
  }

function dibujarEscena() {
    // 1. Limpiar canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const v = getVentana();           // leer ventana de recorte
    const l = lineas[escenaActual];   // línea de la escena actual

    // 2. Aplicar algoritmo Cohen-Sutherland
    const res = cohenSutherland(l.p1.x, l.p1.y, l.p2.x, l.p2.y, v);

    // 3. Línea ORIGINAL completa en gris (antes del recorte)
    drawLine(l.p1.x, l.p1.y, l.p2.x, l.p2.y, '#404040');

    // 4. Resultado del recorte
    if (res.acepta) {
      // Línea recortada en VERDE
      drawLine(res.x0, res.y0, res.x1, res.y1, '#00e676');
    }
    // Si rechaza: no se dibuja nada adicional (línea queda en gris)

    // 5. Ventana de recorte encima (para que tape lo que esté detrás)
    drawViewport(v, '#4ab8e8');

    // 6. Marcar los puntos p1 y p2 originales (pequeño cuadradito)
    marcaPunto(l.p1.x, l.p1.y, '#aaaaaa');
    marcaPunto(l.p2.x, l.p2.y, '#aaaaaa');

    // Si acepta, marcar también los puntos del segmento recortado
    if (res.acepta) {
      marcaPunto(res.x0, res.y0, '#00e676');
      marcaPunto(res.x1, res.y1, '#00e676');
    }

    // Actualizar UI
    document.getElementById('escena-label').textContent =
      `Escena ${escenaActual+1} / ${lineas.length}`;

    actualizarPanel(l, res, v);
  }

  /**
   * Dibuja una pequeña marca (cruz 3×3) en un punto.
   * Usa solo drawPixel — sin métodos de canvas.
   */
  function marcaPunto(x, y, color) {
    x = Math.floor(x); y = Math.floor(y);
    for (let dx=-2; dx<=2; dx++)
      for (let dy=-2; dy<=2; dy++)
        drawPixel(x+dx, y+dy, color);
  }
function actualizarPanel(l, res, v) {

    // Etiqueta de resultado
    const estado = res.acepta
      ? `<span style="color:#00e676">✔ ACEPTADA</span>`
      : `<span style="color:#ff5252">✘ RECHAZADA</span>`;

    // Códigos de región de los puntos originales
    const c0 = assignCode(l.p1.x, l.p1.y, v);
    const c1 = assignCode(l.p2.x, l.p2.y, v);

    // Recorte (solo si acepta)
    const recorteHTML = res.acepta
      ? `<br><b>Recorte:</b><br>
         pc1: <span style="color:#00e676">(${Math.floor(res.x0)}, ${Math.floor(res.y0)})</span><br>
         pc2: <span style="color:#00e676">(${Math.floor(res.x1)}, ${Math.floor(res.y1)})</span>`
      : `<br><span style="color:#ff5252">Segmento descartado.</span>`;

    document.getElementById('coords').innerHTML =
      `<b style="color:#7ecfff">${l.label}</b><br>
       <span style="color:#888;font-size:.7rem">${l.desc}</span><br><br>

       <b>Códigos de región:</b><br>
       <div class="codigo-row">
         p1: <span class="code-tag">${codeStr(c0)}</span>
         p2: <span class="code-tag">${codeStr(c1)}</span>
       </div><br>

       <b>AND:</b> <span class="code-tag">${codeStr(c0 & c1)}</span>
       &nbsp;<b>OR:</b> <span class="code-tag">${codeStr(c0 | c1)}</span><br><br>

       <b>Resultado:</b> ${estado}<br><br>

       <b>Línea:</b><br>
       p1: <span style="color:#f0c040">(${l.p1.x}, ${l.p1.y})</span><br>
       p2: <span style="color:#f0c040">(${l.p2.x}, ${l.p2.y})</span>

       ${recorteHTML}`;
  }


  /** Lee los valores del formulario y retorna la ventana de recorte. */
  function getVentana() {
    return {
      xmin: parseInt(document.getElementById('xmin').value),
      ymin: parseInt(document.getElementById('ymin').value),
      xmax: parseInt(document.getElementById('xmax').value),
      ymax: parseInt(document.getElementById('ymax').value),
    };
  }

  function irA(i)      { escenaActual = i;                          dibujarEscena(); }
  function siguiente() { if (escenaActual < lineas.length-1) { escenaActual++; dibujarEscena(); } }
  function anterior()  { if (escenaActual > 0)               { escenaActual--; dibujarEscena(); } }
  function actualizar(){ dibujarEscena(); }

  // ── Punto de entrada ──
  window.onload = dibujarEscena;

  </script>
</body>
</html>
